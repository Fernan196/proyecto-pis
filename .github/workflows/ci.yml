name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Levanta un contenedor con MongoDB exclusivo para las pruebas
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del Backend
        working-directory: ./backend
        run: npm ci || npm install

      - name: Ejecutar pruebas unitarias (Jest)
        working-directory: ./backend
        run: npm test
        env:
          CI: true
          MONGODB_URI: mongodb://127.0.0.1:27017/proyecto_pis_test
          JWT_SECRET: clave-secreta-para-entorno-de-pruebas