name: Backend CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Le dice que los comandos van aquí
    steps:
    - uses: actions/checkout@v4
    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Instalar dependencias
      run: npm install
    - name: Ejecutar pruebas (Jest)
      run: npm test